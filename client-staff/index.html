<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + maximum-scale stops iOS zooming when a field is focused -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#131316" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Square renders of the SV emblem. The source artwork is 3:2, so pointing
         a tab icon straight at it would squash the logo. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <!-- iOS composites home-screen icons on black and ignores transparency,
         so this one has a white plate baked in. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>SmallVille — Engineering Checklist</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
